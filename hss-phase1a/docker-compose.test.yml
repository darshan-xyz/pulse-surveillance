version: '3.8'

services:
  test-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pulse_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: pulse_test_db
    ports:
      - "5433:5432" # Exposed on 5433 to avoid conflicts with local dev postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_test -d pulse_test_db"]
      interval: 2s
      timeout: 5s
      retries: 5

  test-valkey:
    image: valkey/valkey:7.2-alpine
    ports:
      - "6380:6379" # Exposed on 6380 to avoid conflicts
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5
