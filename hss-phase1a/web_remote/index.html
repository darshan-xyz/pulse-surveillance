<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSS Local WebRTC Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 { margin-top: 0; color: #1a1a1a; }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input, select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { background-color: #0056b3; }
        video {
            width: 100%;
            background: #000;
            border-radius: 4px;
            aspect-ratio: 16/9;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HSS WebRTC Test Client</h1>
    <div class="controls">
        <input type="text" id="cameraId" placeholder="Camera ID" value="test-camera-1" />
        <button id="connectBtn">Connect Stream (Viewer)</button>
        <button id="publishBtn" style="background-color: #28a745;">Publish Webcam (Daemon)</button>
    </div>
    <div style="display: flex; gap: 10px; width: 100%;">
        <div style="flex: 1;">
            <h3 style="margin-top:0;">Cloud Stream (Viewer)</h3>
            <video id="videoPlayer" autoplay playsinline controls muted></video>
        </div>
        <div style="flex: 1;">
            <h3 style="margin-top:0;">Local Webcam (Daemon)</h3>
            <video id="localVideo" autoplay playsinline muted style="border: 2px solid #28a745;"></video>
        </div>
    </div>
    <div class="status" id="statusLog">Status: Waiting to connect...</div>
</div>

<script>
    const connectBtn = document.getElementById('connectBtn');
    const videoPlayer = document.getElementById('videoPlayer');
    const cameraIdInput = document.getElementById('cameraId');
    const statusLog = document.getElementById('statusLog');

    let pc = null;
    let ws = null;
    let sessionId = crypto.randomUUID();

    function logStatus(msg) {
        console.log(msg);
        statusLog.textContent = `Status: ${msg}`;
    }

    connectBtn.addEventListener('click', async () => {
        const camId = cameraIdInput.value.trim();
        if (!camId) return alert("Camera ID required");

        connectBtn.disabled = true;
        logStatus("Connecting WebSocket...");

        // 1. Establish WebSocket dynamically to support Tunnels
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${wsProtocol}//${window.location.host}/client?token=mock_user_jwt`);

        ws.onopen = async () => {
            logStatus("WebSocket Connected. Waiting for SDP Offer...");
            
            const iceConfig = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { 
                        urls: 'turn:openrelay.metered.ca:80',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    { 
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ]
            };
            pc = new RTCPeerConnection(iceConfig);

            // 3. Setup Tranceivers to indicate we want to receive video
            pc.addTransceiver('video', { direction: 'recvonly' });

            // 4. Handle incoming tracks
            pc.ontrack = (event) => {
                logStatus("Received Remote Track!");
                if (videoPlayer.srcObject !== event.streams[0]) {
                    videoPlayer.srcObject = event.streams[0];
                }
            };

            // 5. ICE Candidate Trickle
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: 'candidate',
                        session_id: sessionId,
                        camera_id: camId,
                        candidate: JSON.stringify(event.candidate)
                    }));
                }
            };

            pc.onconnectionstatechange = () => {
                logStatus(`WebRTC State: ${pc.connectionState}`);
                if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    connectBtn.disabled = false;
                }
            };
        };

        let earlyCandidates = [];

        ws.onmessage = async (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'offer') {
                logStatus("Received P2P SDP Offer, creating Answer...");
                await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
                
                // Process any early candidates we received while setting remote desc
                for (const c of earlyCandidates) {
                    await pc.addIceCandidate(c);
                }
                earlyCandidates = [];

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify({
                    type: 'answer',
                    sdp: answer.sdp
                }));
            } else if (msg.type === 'candidate') {
                const candidate = new RTCIceCandidate(JSON.parse(msg.candidate));
                if (pc.remoteDescription) {
                    await pc.addIceCandidate(candidate);
                } else {
                    earlyCandidates.push(candidate);
                }
            }
        };

        ws.onclose = () => {
            logStatus("WebSocket Disconnected.");
            connectBtn.disabled = false;
        };
    });
    const publishBtn = document.getElementById('publishBtn');
    const localVideo = document.getElementById('localVideo');
    let pubPc = null;
    let pubWs = null;

    publishBtn.addEventListener('click', async () => {
        const camId = cameraIdInput.value.trim();
        if (!camId) return alert("Camera ID required");

        publishBtn.disabled = true;
        logStatus("Requesting Webcam Access...");

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            localVideo.srcObject = stream;

            logStatus("Webcam Accessed. Connecting Publisher WebSocket...");
            // Connect to real Go Backend
            pubWs = new WebSocket(`ws://localhost:9091/signaling?token=mock_device_jwt&camera_id=${camId}`);

            pubWs.onopen = async () => {
                logStatus("Publisher WS Connected. Initializing WebRTC...");
                
            const iceConfig = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { 
                        urls: 'turn:openrelay.metered.ca:80',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    { 
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ]
            };
            pubPc = new RTCPeerConnection(iceConfig);

                // Add webcam tracks to PeerConnection
                stream.getTracks().forEach(track => pubPc.addTrack(track, stream));

                pubPc.onicecandidate = (event) => {
                    if (event.candidate) {
                        pubWs.send(JSON.stringify({
                            type: 'candidate',
                            candidate: JSON.stringify(event.candidate)
                        }));
                    }
                };

                // Create and send Offer
                const offer = await pubPc.createOffer();
                await pubPc.setLocalDescription(offer);

                logStatus("Sending Publisher SDP Offer...");
                pubWs.send(JSON.stringify({
                    type: 'offer',
                    sdp: offer.sdp
                }));
            };

            let pubEarlyCandidates = [];

            pubWs.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'answer') {
                    logStatus("Received Publisher SDP Answer");
                    await pubPc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
                    
                    for (const c of pubEarlyCandidates) {
                        await pubPc.addIceCandidate(c);
                    }
                    pubEarlyCandidates = [];
                } else if (msg.type === 'candidate') {
                    const candidate = new RTCIceCandidate(JSON.parse(msg.candidate));
                    if (pubPc.remoteDescription) {
                        await pubPc.addIceCandidate(candidate);
                    } else {
                        pubEarlyCandidates.push(candidate);
                    }
                }
            };
        } catch (err) {
            logStatus(`Webcam Error: ${err}`);
            publishBtn.disabled = false;
        }
    });

</script>
</body>
</html>
