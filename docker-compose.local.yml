version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulse-postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: pulse-valkey-local
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--appendonly", "yes"]
    stop_grace_period: 5s

  pulse-cloud:
    build: 
      context: ./hss-phase1a
      dockerfile: build/Dockerfile.cloud
    container_name: pulse-cloud-local
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/pulse?sslmode=disable
      - REDIS_URL=valkey:6379
      - PORT=9091
    ports:
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pulse-tunnel
    command: tunnel --url http://host.docker.internal:5173 --no-autoupdate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pulse-cloud
    restart: on-failure

volumes:
  postgres_data:
  valkey_data:
