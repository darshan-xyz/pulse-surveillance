version: '3.8'

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
    environment:
      - MTX_PROTOCOLS=tcp
      - MTX_WEBRTC=no

  ffmpeg-mock:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: ffmpeg-mock
    depends_on:
      - mediamtx
    command: >
      -re -f lavfi -i testsrc=size=1280x720:rate=30 
      -f lavfi -i sine=frequency=1000:sample_rate=48000 
      -c:v libx264 -b:v 1M -preset veryfast -pix_fmt yuv420p -g 60
      -c:a aac -b:a 128k
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/cam1

  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    command: >
      -n --log-file=stdout --min-port=49152 --max-port=65535
      --realm=localhost --user=pulse:landing

